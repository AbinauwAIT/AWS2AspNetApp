name: ASP.NET Core CI-CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup .NET 7
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '7.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build application
        run: dotnet build --configuration Release --no-restore

      - name: Publish application
        run: dotnet publish --configuration Release --no-build --output ./publish

      - name: Upload published application
        uses: actions/upload-artifact@v4
        with:
          name: aspnet-app
          path: ./publish

  deploy:
    needs: build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: self-hosted

    steps:
      - name: Download published application
        uses: actions/download-artifact@v4
        with:
          name: aspnet-app
          path: ${{ runner.temp }}\AWS2AspNetApp

      - name: Verify downloaded application
        shell: powershell
        run: |
          $source = "${{ runner.temp }}\AWS2AspNetApp"

          Write-Host "Downloaded application files:"
          Get-ChildItem $source -Recurse

          if (!(Test-Path "$source\AWS2AspNetApp.dll")) {
              Write-Error "AWS2AspNetApp.dll was not found."
              exit 1
          }

          Write-Host "Application artifact verified successfully."

      - name: Deploy application to IIS
        shell: powershell
        run: |
          $source      = "${{ runner.temp }}\AWS2AspNetApp"
          $destination = "C:\WebApps\AWS2AspNetApp"
          $offline     = Join-Path $destination "app_offline.htm"

          if (!(Test-Path $destination)) {
              New-Item -ItemType Directory -Path $destination -Force | Out-Null
          }

          try {
              Set-Content -Path $offline -Value "<html><body><h1>Updating, back shortly...</h1></body></html>"
              Start-Sleep -Seconds 5
              Copy-Item "$source\*" $destination -Recurse -Force
          }
          finally {
              Remove-Item $offline -Force -ErrorAction SilentlyContinue
          }

          Get-Item "$destination\AWS2AspNetApp.dll" |
            Select-Object Name, Length, LastWriteTime

      - name: Smoke test
        shell: powershell
        run: |
          $r = Invoke-WebRequest -Uri "http://localhost" -UseBasicParsing
          Write-Host "Status: $($r.StatusCode)"