      - name: Deploy application to IIS
        shell: powershell
        run: |
          $source = "${{ runner.temp }}\AWS2AspNetApp"
          $destination = "C:\WebApps\AWS2AspNetApp"
          $appPool = "AWS2AspNetApp"

          Write-Host "Stopping IIS application pool..."

          Stop-WebAppPool -Name $appPool

          Start-Sleep -Seconds 5

          Write-Host "Copying application files..."

          if (!(Test-Path $destination)) {
              New-Item -ItemType Directory -Path $destination -Force
          }

          Copy-Item "$source\*" $destination -Recurse -Force

          Write-Host "Starting IIS application pool..."

          Start-WebAppPool -Name $appPool

          Write-Host "Deployment completed successfully."

          Get-Item "$destination\AWS2AspNetApp.dll" |
            Select-Object Name, Length, LastWriteTime