  deploy:
    needs: build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: self-hosted

    steps:
      - name: Download published application
        uses: actions/download-artifact@v4
        with:
          name: aspnet-app
          path: ${{ runner.temp }}\AWS2AspNetApp

      - name: Verify downloaded application
        shell: powershell
        run: |
          $source = "${{ runner.temp }}\AWS2AspNetApp"

          Write-Host "Downloaded application files:"
          Get-ChildItem $source -Recurse

          if (!(Test-Path "$source\AWS2AspNetApp.dll")) {
              Write-Error "AWS2AspNetApp.dll was not found."
              exit 1
          }

          Write-Host "Application artifact verified successfully."

      - name: Deploy application to IIS
        shell: powershell
        run: |
          $source = "${{ runner.temp }}\AWS2AspNetApp"
          $destination = "C:\WebApps\AWS2AspNetApp"

          Write-Host "Starting deployment..."
          Write-Host "Source: $source"
          Write-Host "Destination: $destination"

          if (!(Test-Path $destination)) {
              New-Item -ItemType Directory -Path $destination -Force
          }

          Copy-Item "$source\*" $destination -Recurse -Force

          Write-Host "Deployment completed successfully."

          Get-Item "$destination\AWS2AspNetApp.dll" |
            Select-Object Name, Length, LastWriteTime